<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/keyboard-favicon.jpg">
    <link rel="stylesheet" href="styles.css">
    <title>Odin Project Sign-up Form</title>
</head>
<body>
    <div class="container-left">
        <img src="images/no-face.jpg" alt="Man hiding his face behind his hand in a plume of smoke" width="1920" height="2405">
    </div>
    <div class="container-right">
        <header class="form-header">
            <h2>This is totally not a made up sign-up form that does nothing.</h2>
            <p>Definitely not a secret organization. <em>Just keep scrolling.</em></p>
        </header>
        <form action="">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name: <input type="text" name="first" id="firstName" required></label>
                    <label for="lastName">Last Name: <input type="text" name="last" id="lastName" required></label>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="user-email">E-mail: <input type="email" name="mail" id="user-email" required></label>
                    <label for="user-tel">Phone: <input type="tel" name="phone" id="user-tel"></label>
                </div>
                <div class="form-group">
                    <label for="psw">Password:<input type="text" name="password" id="psw"></label>
                    <label for="confirm">Confirm Password: <input type="text" name="confirm" id="confirm"></label>
                </div>
            </div>
        </form>
        <div class="action-container">
            <button>Create Account</button>
            <p>Already have an account <a href="#">Login</a></p>
        </div>
    </div>
</body>
</html>
